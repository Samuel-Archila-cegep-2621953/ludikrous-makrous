[package]
name = "serveur-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
bincode-next = "3.2.0"
dashmap = "6.2.1"
dyn-clone = "1.0.20"
futures-util = { version = "0.3.34", features = ["io", "sink", "async-await"] }
hex = "0.4.3"
rand = "0.10.4"
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.2"
tokio = { version = "1.54.1", features = ["full"] }
tokio-tungstenite = "0.30.0"
